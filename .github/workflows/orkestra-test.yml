name: orkestra-test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      ORKESTRA_DOKTOR_OTOMATIK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Doktor kuru koşu (temiz makine)
        run: python plugins/orkestra/scripts/doktor.py --kuru --json
      - name: I-026 testleri
        working-directory: plugins/orkestra
        run: python -m pytest tests/test_cfg.py tests/test_doktor.py tests/test_doktor_hizli_yol.py tests/test_doktor_proje.py tests/test_tasinabilirlik.py tests/test_cli_baslatici.py tests/test_python_secimi.py -q
