<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orkestra · Yapılacaklar</title>
<link rel="stylesheet" href="ortak.css">
<link rel="stylesheet" href="gorsel.css">
<link rel="stylesheet" href="yapilacaklar.css">
</head>
<body>
<header id="kabuk"></header>
<main>
  <h1 class="gorunmez">Yapılacaklar</h1>
  <div id="yOzet" class="y-ozet" aria-live="polite"></div>
  <div class="g-iki y-iki">
  <section class="bolum" aria-labelledby="kBaslik">
    <h2 id="kBaslik">Benim yapılacaklarım <span class="meta" id="kSayi"></span></h2>
    <p class="aciklama" id="kAlan">Yaz, Enter ile ekle.</p>
    <div class="yap-ekle">
      <textarea id="kYeni" rows="2" placeholder="Yeni madde… (Enter ile ekle, Shift+Enter yeni satır)" aria-label="Yeni madde" aria-describedby="kSayac" maxlength="2000"></textarea>
      <button type="button" id="kEkle">Ekle</button>
    </div>
    <div class="yap-alt"><span>Kısayol: Enter ekler · Shift+Enter yeni satır</span><span id="kSayac">0 / 2000</span></div>
    <div class="yap-geri" id="kGeri" role="status" hidden><span id="kGeriMetin"></span><button type="button" id="kGeriAl">Geri al</button></div>
    <input type="search" id="kAra" placeholder="Maddelerde ara…" aria-label="Maddelerde ara" hidden>
    <ul id="kListe" class="yap-liste" aria-live="polite"><li class="bos">Yükleniyor…</li></ul>
  </section>
  </div>
</main>
<div id="ipucu"></div>
<div id="bildirim" role="status" aria-live="polite"></div>
<script src="ortak.js"></script>
<script src="gorsel.js"></script>
<script src="yapilacaklar.js"></script>
</body>
</html>
