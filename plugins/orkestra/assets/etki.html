<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orkestra · Etki</title>
<link rel="stylesheet" href="ortak.css">
<link rel="stylesheet" href="etki.css">
</head>
<body>
<header id="kabuk"></header>
<main>
  <h1 class="gorunmez">Etki</h1>
  <section class="bolum" aria-labelledby="eOzetBaslik">
    <h2 id="eOzetBaslik">Etki <span class="meta" id="eSayi"></span><span id="eBayat"></span></h2>
    <p class="aciklama">Uygulanan kararların vaadi uygulama gününden başlayarak günlük ölçülür; izleme kapatılana ya da geri alınana dek sürer.</p>
    <div class="karolar" id="eOzet"></div>
  </section>
  <section class="bolum" aria-labelledby="eListeBaslik">
    <h2 id="eListeBaslik">Uygulanan kararlar</h2>
    <div id="eListe"><p class="bos">Yükleniyor…</p></div>
  </section>
  <section class="bolum" aria-labelledby="eGrafikBaslik" id="eGrafikKutu" hidden>
    <h2 id="eGrafikBaslik">Gün gün gidişat <span class="meta" id="eGrafikMeta"></span></h2>
    <div id="eGrafikNot"></div>
    <div class="grafik-kap" id="eGrafik"></div>
    <div class="gosterge" id="eGosterge"></div>
  </section>
</main>
<div id="ipucu"></div>
<div id="bildirim" role="status" aria-live="polite"></div>
<script src="ortak.js"></script>
<script src="etki.js"></script>
</body>
</html>
